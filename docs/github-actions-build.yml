name: Build desktop apps
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            command: dist:mac
          - os: macos-15-intel
            command: dist:mac
          - os: windows-latest
            command: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
